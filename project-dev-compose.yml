services:
  backend:
    build: ./app/backend
    container_name: app_backend
    volumes:
      - ./app/backend:/app
      - static_files:/app/staticfiles
      - ${SHARED_HOST_DIR:-./shared}:/shared
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=true
      # Свой ключ dev-среды: USE_GUNICORN из .env остаётся для прода.
      - USE_GUNICORN=${DEV_USE_GUNICORN:-false}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      gotenberg:
        condition: service_started
    restart: unless-stopped
  celery:
    build: ./app/backend
    container_name: app_celery
    command: celery -A backend worker --beat --pool=solo --loglevel=info --schedule=/tmp/celerybeat-schedule --without-gossip --without-mingle --without-heartbeat
    volumes:
      - ./app/backend:/app
      - ${SHARED_HOST_DIR:-./shared}:/shared
    env_file:
      - .env
    # Как у backend: при DEBUG письма о решениях уходят только test_*-учёткам (dev-база - копия
    # реальной), а с DEV_EMAIL_REDIRECT все письма - на этот адрес.
    environment:
      - DEBUG=true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
        reservations:
          cpus: '0.10'
          memory: 128M
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile.dev
    container_name: app_frontend
    # Turbopack не видит правок на Windows-хосте (событий файлов через bind mount нет, а
    # WATCHPACK_POLLING он игнорирует); webpack опрашивает файлы. На Linux/WSL можно turbopack.
    command: ["pnpm", "exec", "next", "dev", "--${DEV_NEXT_BUNDLER:-webpack}", "-H", "0.0.0.0", "-p", "3000"]
    volumes:
      - ./app/frontend:/app
      - /app/node_modules
      - next_cache:/app/.next
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1.25'
    #       memory: 1536M
    #     reservations:
    #       cpus: '0.25'
    #       memory: 512M
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_TELEMETRY_DISABLED=1
      # - NEXT_TURBOPACK_TRACING=1
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - NODE_ENV=development
      - CI=true
    env_file:
      - .env
    depends_on:
      - backend
    restart: unless-stopped
  db:
    image: postgres:17.11-alpine
    container_name: postgres_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      # Дампы и бэкапы БД только для чтения и загрузка DEV_DB_DUMP при первом старте пустого тома.
      # Сменить дамп у работающей базы: scripts/dev db-restore.
      - ${SHARED_HOST_DIR:-./shared}/dumps:/dumps:ro
      - ${SHARED_HOST_DIR:-./shared}/backups/db:/backups/db:ro
      - ./scripts/dev-db-restore.sh:/docker-entrypoint-initdb.d/10-dev-db-restore.sh:ro
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
        reservations:
          cpus: '1.0'
          memory: 1G
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      DEV_DB_DUMP: ${DEV_DB_DUMP:-}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 10s
    restart: unless-stopped
  redis:
    image: redis:8.10.3-alpine
    container_name: app_redis
    environment:
      REDIS_USER: ${REDIS_USER}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli PING"]
      interval: 10s
      retries: 3
      timeout: 5s
  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    container_name: app_seaweedfs
    ports:
      - "8333:8333"
      - "9333:9333"
      - "8888:8888"
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY}
      AWS_STORAGE_BUCKET_NAME: ${SEAWEEDFS_BUCKET_NAME}
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - seaweedfs_data:/data
      - ./seaweedfs-entrypoint.sh:/entrypoint.sh:ro
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9333/cluster/status"]
      interval: 30s
      retries: 3
      start_period: 20s
      timeout: 10s
  gotenberg:
    image: gotenberg/gotenberg:8.39.0-libreoffice
    container_name: app_gotenberg
    command:
      - gotenberg
      - --api-timeout=90s
    ports:
      - "3001:3000"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    restart: unless-stopped
  nginx:
    build: ./app/nginx
    container_name: app_nginx
    ports:
      - "80:80"
    volumes:
      - static_files:/app/staticfiles:ro
      # Правки применяются через `restart nginx` / `nginx -s reload`, без пересборки (--build).
      - ./app/nginx/default.dev.conf:/etc/nginx/conf.d/default.conf:ro
      # CSP с unsafe-eval для webpack-dev (DEV_NEXT_BUNDLER=webpack); прод берёт security-headers.conf из образа.
      - ./app/nginx/security-headers.dev.conf:/etc/nginx/security-headers.conf:ro
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
      seaweedfs:
        condition: service_healthy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  redis_data:
  seaweedfs_data:
  static_files:
  next_cache: