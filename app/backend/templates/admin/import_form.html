{% extends "admin/base_site.html" %}
{% block content %}

        После нажатия «Начать импорт» страница может долго грузиться из-за добавления/обновления записей.
        Дополнительная информация о ходе импорта — в логах бэкенда.

</ul>
<form action="." method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}

</form>
{% endblock %}
