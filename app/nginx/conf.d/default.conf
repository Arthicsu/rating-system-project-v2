limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC:10m inactive=7d use_temp_path=off;

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

server {
    listen 80;

    server_name _;

    # Backend принимает максимум 20 МБ на заявку (students/serializers.py) —
    # 25M = лимит + multipart-оверхед; 50M впустую держал память под отказ.
    client_max_body_size 25M;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    
    limit_req_status 429;


    # Next.js static files - browser cache only (no nginx caching to avoid gzip issues)
    location /_next/static/ {
        proxy_cache STATIC;
        proxy_cache_valid 60m;
        proxy_pass http://frontend;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # add_header в location отменяет унаследованные заголовки — возвращаем security-набор.
        include /etc/nginx/security-headers.conf;
        access_log off;
    }

    location /_next/data/ {
        proxy_pass http://frontend;
        expires 30d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
        access_log off;
    }

    # Django static files
    location /static/ {
        alias /app/staticfiles/;
        proxy_ignore_headers Cache-Control Set-Cookie;
        proxy_cache_valid 60m;
        expires 30d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
        access_log off;
    }

    # Next.js public static files
    location /public/ {
        proxy_pass http://frontend;
        expires 30d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
        access_log off;
    }

    # Frontend media files (public/media/*)
    location /media/ {
        proxy_pass http://frontend;
        access_log off;
    }

    # Брутфорс-защита аутентификации/регистрации
    location = /api/v1/auth/login/ {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://backend;
    }
    location = /api/v1/auth/forgot-password/ {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://backend;
    }
    location = /user/api/v1/register/student/ {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://backend;
    }
    location = /admin/login/ {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://backend;
    }

    # API и admin -> Django (все ручки живут под /api/v1/, router DRF)
    location ~ ^/(api|admin) {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://backend;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Frontend (Next.js) - без кэширования (динамика)
    location / {
        proxy_pass http://frontend;
    }
}