# DEV-вариант конфига nginx.
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

server {
    listen 80;

    server_name _;

    # Backend принимает максимум 20 МБ на заявку — 25M с multipart-запасом.
    client_max_body_size 25M;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # всё... прокси-кэш nginx выключен полностью
    proxy_cache off;

    # не кэшируем статику Next
    # (include: add_header в location отменяет унаследованные security-заголовки)
    location /_next/static/ {
        proxy_pass http://frontend;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;
        expires off;
        access_log off;
    }

    location /_next/data/ {
        proxy_pass http://frontend;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;
        expires off;
        access_log off;
    }

    # Django static files
    location /static/ {
        alias /app/staticfiles/;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;
        expires off;
        access_log off;
    }

    location /public/ {
        proxy_pass http://frontend;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;
        expires off;
        access_log off;
    }

    location /media/ {
        proxy_pass http://frontend;
        access_log off;
    }

    # Брутфорс-защита аутентификации
    location = /api/v1/auth/login/ {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://backend;
    }
    location = /api/v1/auth/forgot-password/ {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://backend;
    }
    location = /user/api/v1/register/student/ {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://backend;
    }
    location = /admin/login/ {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://backend;
    }

    # API и admin -> Django (все ручки живут под /api/v1/, router DRF)
    location ~ ^/(api|admin) {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://backend;

        proxy_connect_timeout 500s;
        proxy_send_timeout 500s;
        proxy_read_timeout 500s;
    }

    # Frontend (Next.js) + HMR-вебсокет. И в dev версии страницы тоже не кэшируем
    location / {
        proxy_pass http://frontend;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;
        expires off;

        proxy_connect_timeout 500s;
        proxy_send_timeout 500s;
        proxy_read_timeout 500s;
    }
}
