# Security-заголовки — единый сниппет.
#
# ВАЖНО (правило наследования nginx): add_header НЕ наследуется в блоки,
# где объявлен свой add_header. Поэтому этот файл включается и в http {},
# и в КАЖДУЮ location с собственными add_header (кэширующие статики) —
# иначе именно там security-заголовки молча пропадают.
#
# X-XSS-Protection намеренно отсутствует: заголовок deprecated,
# современные браузеры его игнорируют.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;

# HSTS: по чистому http браузер обязан игнорировать STS (RFC 6797 §8.1),
# поэтому безусловная отдача безвредна; когда внешний TLS-прокси вуза
# терминирует https — заголовок применяется. Backend HSTS при этом стоит
# выключить (SECURE_HSTS_SECONDS=0 в .env), чтобы источник был один.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# CSP — сейчас в режиме Report-Only: нарушения видны в консоли браузера,
# но ничего не блокируется. После полного прогона всех страниц с чистой
# консолью (login, rating, staff-profile все вкладки, upload, предпросмотр
# PDF/изображений/docx, radar-профиль, скачивание) заменить имя заголовка
# на Content-Security-Policy (enforce).
#
# Пояснения к директивам:
#  - script-src 'unsafe-inline' — inline-бутстрап Next.js (без nonce-архитектуры);
#  - blob: в connect/frame/img/worker-src — предпросмотр файлов (pdf.js worker,
#    iframe-фолбэк и <img> получают blob:-URL из useFilePreview).
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob:; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
