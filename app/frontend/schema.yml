  /api/v1/academic-years/:
    get:
      operationId: v1_academic_years_list
      description: Учебные периоды для селектора семестра (кэш 2 часа).
      tags:
      - academic-years
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicYear'
          description: ''
  /api/v1/achievements/:
    get:
      operationId: v1_achievements_list
      description: |-
        Достижения (заявки студентов).

        - create — загрузка достижения студентом (throttle 'upload');
        - retrieve — карточка заявки (владелец или сотрудник в scope);
        - partial_update / destroy — правка/удаление своей заявки
          (чужие скрыты фильтром по владельцу: 404, существование не раскрывается);
        - list — заявки на модерацию для сотрудника (?list_type=pending|reviewed),
          в пагинированный ответ добавляются stats и top5;
        - review — решение по заявке (кафедра / декан / ректорат);
        - config — конфигурация формы загрузки (кэш 1 час).
      parameters:
      - in: query
        name: academic_year
        schema:
          type: integer
        description: ID семестра (по умолчанию — текущий)
      - in: query
        name: course
        schema:
          type: string
      - in: query
        name: faculty_id
        schema:
          type: string
      - in: query
        name: group_id
        schema:
          type: string
      - in: query
        name: list_type
        schema:
          type: string
        description: pending (по умолчанию) | reviewed
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: semester
        schema:
          type: integer
        description: Синоним academic_year
      tags:
      - achievements
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPendingDocumentList'
          description: ''
    post:
      operationId: v1_achievements_create
      description: |-
        Достижения (заявки студентов).

        - create — загрузка достижения студентом (throttle 'upload');
        - retrieve — карточка заявки (владелец или сотрудник в scope);
        - partial_update / destroy — правка/удаление своей заявки
          (чужие скрыты фильтром по владельцу: 404, существование не раскрывается);
        - list — заявки на модерацию для сотрудника (?list_type=pending|reviewed),
          в пагинированный ответ добавляются stats и top5;
        - review — решение по заявке (кафедра / декан / ректорат);
        - config — конфигурация формы загрузки (кэш 1 час).
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          format: uuid
        description: 'UUID попытки отправки: повтор с тем же ключом получает 409 вместо
          дубля.'
      tags:
      - achievements
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AchievementUpload'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AchievementUpload'
          application/json:
            schema:
              $ref: '#/components/schemas/AchievementUpload'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
