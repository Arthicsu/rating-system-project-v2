  /api/v1/rating/:
    get:
      operationId: v1_rating_list
      description: |-
        Рейтинг студентов за выбранный семестр (по умолчанию текущий). Доступ
        только сотрудникам: ФИО и баллы всех студентов - не для любого
        авторизованного.

        - list — пагинированный рейтинг с фильтрами, выбором семестра и
          сортировкой по категории/направлению;
        - filters — данные для построения фильтров (кэш 2 часа);
        - export — выгрузка рейтинга в Excel (те же параметры, что и list).
      parameters:
      - in: query
        name: academic_year
        schema:
          type: integer
        description: ID семестра (по умолчанию — текущий)
      - in: query
        name: category
        schema:
          type: string
        description: 'Категория сортировки: common (по умолчанию) | academic | research
          | sport | social | cultural'
      - in: query
        name: course
        schema:
          type: string
      - in: query
        name: direction
        schema:
          type: string
        description: 'Направление сортировки: desc (по умолчанию) | asc'
      - in: query
        name: faculty_id
        schema:
          type: string
      - in: query
        name: group_id
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: semester
        schema:
          type: integer
        description: Синоним academic_year
      tags:
      - rating
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStudentRatingList'
          description: ''
  /api/v1/rating/export/:
