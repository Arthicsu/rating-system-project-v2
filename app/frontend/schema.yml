  /api/v1/rating/filters/:
    get:
      operationId: v1_rating_filters_retrieve
      description: |-
        Рейтинг студентов за выбранный семестр (по умолчанию текущий). Доступ
        только сотрудникам: ФИО и баллы всех студентов - не для любого
        авторизованного.

        - list — пагинированный рейтинг с фильтрами, выбором семестра и
          сортировкой по категории/направлению;
        - filters — данные для построения фильтров (кэш 2 часа);
        - export — выгрузка рейтинга в Excel (те же параметры, что и list).
      tags:
      - rating
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingFiltersResponse'
          description: ''
  /api/v1/rejection-reasons/:
    get:
      operationId: v1_rejection_reasons_list
      description: Справочник активных причин отклонения заявок (кэш 2 часа).
      tags:
      - rejection-reasons
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RejectionReason'
          description: ''
  /api/v1/staff/me/:
    get:
      operationId: v1_staff_me_retrieve
      description: Профиль сотрудника (деканат / кафедра / ректорат).
      tags:
      - staff
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffProfileResponse'
          description: ''
  /api/v1/students/:
    get:
      operationId: v1_students_list
      description: |-
        Студенты.

        - list — студенты в области видимости сотрудника с фильтрами и выбором
          семестра (прошлый семестр — баллы из истории SemesterScore);
        - retrieve — полный профиль (свой или в scope сотрудника);
        - me — собственный профиль студента.
      parameters:
      - in: query
        name: academic_year
        schema:
          type: integer
        description: ID семестра (по умолчанию — текущий)
      - in: query
        name: course
        schema:
          type: string
      - in: query
        name: faculty_id
        schema:
          type: string
      - in: query
        name: group_id
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: semester
        schema:
          type: integer
        description: Синоним academic_year
      tags:
      - students
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStudentProfileList'
          description: ''
  /api/v1/students/{id}/:
    get:
      operationId: v1_students_retrieve
      description: |-
        Студенты.

        - list — студенты в области видимости сотрудника с фильтрами и выбором
          семестра (прошлый семестр — баллы из истории SemesterScore);
        - retrieve — полный профиль (свой или в scope сотрудника);
        - me — собственный профиль студента.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - students
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfile'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
  /api/v1/students/me/:
    get:
      operationId: v1_students_me_retrieve
      description: |-
        Студенты.

        - list — студенты в области видимости сотрудника с фильтрами и выбором
          семестра (прошлый семестр — баллы из истории SemesterScore);
        - retrieve — полный профиль (свой или в scope сотрудника);
        - me — собственный профиль студента.
      tags:
      - students
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
