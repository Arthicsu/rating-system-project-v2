services:
  backend:
    build: ./app/backend
    container_name: app_backend
    volumes:
      - ./app/backend:/app
      - static_files:/app/staticfiles
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - USE_GUNICORN=${USE_GUNICORN:-false}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build: ./app/frontend
    container_name: app_frontend
    volumes:
      - ./app/frontend:/app
      - /app/node_modules
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_TELEMETRY_DISABLED=1
    env_file:
      - .env
    depends_on:
      - backend
    restart: unless-stopped
  db:
    image: postgres:17
    container_name: postgres_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      # - ./dump.sql:/docker-entrypoint-initdb.d/dump.sql
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 10s
    restart: unless-stopped
  redis:
    image: redis:8.6.2-alpine
    container_name: app_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      retries: 3
      timeout: 5s
  seaweedfs:
    image: chrislusf/seaweedfs:4.20
    container_name: app_seaweedfs
    ports:
      - "8333:8333"
      - "9333:9333"
      - "8888:8888"
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY}
      AWS_STORAGE_BUCKET_NAME: ${SEAWEEDFS_BUCKET_NAME}
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - seaweedfs_data:/data
      - ./seaweedfs-entrypoint.sh:/entrypoint.sh:ro
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9333/cluster/status"]
      interval: 15s
      retries: 3
      start_period: 10s
      timeout: 10s
  nginx:
    build: ./app/nginx
    container_name: app_nginx
    ports:
      - "80:80"
    volumes:
      - static_files:/app/staticfiles:ro
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    depends_on:
      backend:
        condition: service_started
      seaweedfs:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 15s
      retries: 3
      timeout: 5s

volumes:
  postgres_data:
  redis_data:
  seaweedfs_data:
  static_files: